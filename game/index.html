        <script src="/socket.io/socket.io.js"></script>
	<script>var socket = io();
var players = {};
var keys = {};
socket.on("state", serverPlayers => {
    players = serverPlayers;
});
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);
var canvas = document.querySelector("canvas");
var ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
var loop = () => {
    var dx = 0;
    var dy = 0;
    if(keys["w"] || keys["ArrowUp"]) dy -= 5;
    if(keys["s"] || keys["ArrowDown"]) dy += 5;
    if(keys["a"] || keys["ArrowLeft"]) dx -= 5;
    if(keys["d"] || keys["ArrowRight"]) dx += 5;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if(dx !== 0 || dy !== 0){socket.emit("move", { dx, dy });}
    for(var id in players){
        var p = players[id];
        ctx.beginPath();
	ctx.arc(p.x + 15, p.y + 15, 15, 0, Math.PI * 2);
	ctx.fillStyle = p.color;
	ctx.fill();
    }
    requestAnimationFrame(loop);
};
loop();</script>
